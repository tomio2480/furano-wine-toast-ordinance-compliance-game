name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # 打ち切るのは PR の古い実行だけとし，main への push で実行中のものは止めない．
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ビルドは E2E の job（Playwright の webServer）とデプロイの workflow で行う．
  check:
    name: Typecheck, lint, unit test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: E2E (Playwright, axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # 失敗した検査の trace（retain-on-failure）を，原因を調べられるよう残す．
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  complexity:
    name: Complexity (cccc)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 版を上げるときは，同じ release の .sha256 と照らしてから両方を書き換える．
      CCCC_VERSION: "1.10.0"
      CCCC_SHA256: "a11f0fbd560de11078283a2d54aee0d29cf0061585f45ab45cdb810d95db2a84"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install cccc (pinned version, SHA-256 verified)
        run: |
          set -euo pipefail
          archive="cccc-v${CCCC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/moznion/cccc/releases/download/v${CCCC_VERSION}/${archive}"
          (cd "${RUNNER_TEMP}" && echo "${CCCC_SHA256}  ${archive}" | sha256sum --check --strict)
          mkdir -p "${RUNNER_TEMP}/cccc"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/cccc"
          bin="$(find "${RUNNER_TEMP}/cccc" -type f -name cccc -print -quit)"
          "${bin}" --version
          echo "CCCC_BIN=${bin}" >> "${GITHUB_ENV}"

      - run: npm run complexity
