version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # typescript-eslint が対応する範囲でしか TypeScript を上げられないため，両者を同じ PR で扱う．
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
