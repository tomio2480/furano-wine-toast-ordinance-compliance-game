    <path d="M800 340 Q 900 290 980 330 T 1150 320 V 450 H 800 Z" fill="#c9d6ea"/>
    <path d="M860 380 l 26 -70 l 26 70 z M940 390 l 22 -60 l 22 60 z M1060 385 l 26 -70 l 26 70 z" fill="#294a43"/>
    <rect x="800" y="395" width="350" height="55" fill="#f4f7fc"/>
