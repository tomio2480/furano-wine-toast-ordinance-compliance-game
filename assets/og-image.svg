  <g font-family="'Yu Gothic UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
    <text x="64" y="250" font-size="78" font-weight="800" fill="#f2b544">乾杯条例ディフェンス</text>
    <text x="68" y="318" font-size="38" font-weight="700" fill="#f7f3ea">まずは、ふらのワインで乾杯！</text>
    <text x="68" y="374" font-size="28" fill="#d9d3c7">ワインとぶどう果汁以外は雪玉で退場</text>
    <text x="68" y="600" font-size="24" fill="#3a2a24">非公式のファンゲーム</text>
  </g>
