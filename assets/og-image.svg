  <rect x="800" y="120" width="350" height="30" fill="#f2f0ea"/>
  <rect x="800" y="120" width="350" height="330" fill="none" stroke="#e8e6df" stroke-width="8"/>
  <line x1="975" y1="150" x2="975" y2="450" stroke="#e8e6df" stroke-width="6"/>

  <g>
    <rect x="110" y="112" width="300" height="200" fill="url(#glow)"/>
    <line x1="260" y1="0" x2="260" y2="120" stroke="#3a3330" stroke-width="2"/>
    <path d="M226 150 A 34 34 0 0 1 294 150 Z" fill="url(#copper)"/>
    <line x1="620" y1="0" x2="620" y2="120" stroke="#3a3330" stroke-width="2"/>
    <path d="M586 150 A 34 34 0 0 1 654 150 Z" fill="url(#copper)"/>
  </g>

  <rect x="0" y="500" width="1200" height="130" fill="#d7b688"/>
  <rect x="30" y="482" width="1140" height="18" rx="4" fill="#6b4430"/>
  <rect x="30" y="500" width="1140" height="40" rx="4" fill="#4a2d1f"/>

  <g transform="translate(660 470) scale(4.2)">
    <path d="M-12 -44 Q -13 -22 0 -20 Q 13 -22 12 -44 Z" fill="#ebf5fa" fill-opacity="0.6" stroke="#2a1d18" stroke-width="1.6"/>
    <path d="M-12.6 -34 H 12.6 Q 11 -21 0 -20 Q -11 -21 -12.6 -34 Z" fill="#7a0f2b"/>
    <line x1="0" y1="-20" x2="0" y2="-4" stroke="#3d3a3a" stroke-width="2.4"/>
    <ellipse cx="0" cy="-3" rx="10" ry="3" fill="#f5fbff" stroke="#2a1d18" stroke-width="1.2"/>
