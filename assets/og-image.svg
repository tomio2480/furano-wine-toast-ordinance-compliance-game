      <circle cx="830" cy="180" r="3"/><circle cx="880" cy="230" r="2"/><circle cx="940" cy="190" r="3"/>
      <circle cx="1000" cy="250" r="2"/><circle cx="1060" cy="200" r="3"/><circle cx="1120" cy="240" r="2"/>
      <circle cx="850" cy="290" r="2"/><circle cx="1010" cy="300" r="3"/><circle cx="1100" cy="170" r="2"/>
      <circle cx="960" cy="350" r="2"/><circle cx="1130" cy="330" r="3"/><circle cx="900" cy="330" r="2"/>
    </g>
