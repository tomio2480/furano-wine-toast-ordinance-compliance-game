<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    OGP 用の画像．タイトル画面と同じ 1990〜2000 年代のウェブサイト風にする．
    色はウェブセーフカラーとし，グラデーションは帯に分ける．
    scripts/render-og-image.mjs が半分の大きさで描き，色を丸めてから 2 倍に拡大する．
  -->
  <defs>
    <linearGradient id="logo-bands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffff99"/>
      <stop offset="0.25" stop-color="#ffff99"/>
      <stop offset="0.25" stop-color="#ffcc00"/>
      <stop offset="0.5" stop-color="#ffcc00"/>
      <stop offset="0.5" stop-color="#ff9900"/>
      <stop offset="0.75" stop-color="#ff9900"/>
      <stop offset="0.75" stop-color="#ff6600"/>
      <stop offset="1" stop-color="#ff6600"/>
    </linearGradient>
    <clipPath id="picture"><rect x="772" y="262" width="356" height="206"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="8" y="8" width="1184" height="614" fill="none" stroke="#ffcc00" stroke-width="16"/>

  <!-- 題字の帯．青を 4 本の帯に分ける． -->
  <rect x="16" y="16" width="1168" height="48" fill="#3366ff"/>
  <rect x="16" y="64" width="1168" height="48" fill="#3333ff"/>
  <rect x="16" y="112" width="1168" height="56" fill="#0033cc"/>
  <rect x="16" y="168" width="1168" height="38" fill="#003399"/>

  <g font-family="'MS PGothic', 'ＭＳ Ｐゴシック', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif">
    <g font-size="100" font-weight="900" text-anchor="middle">
      <text x="610" y="158" fill="#000000" stroke="#000000" stroke-width="12" stroke-linejoin="round">乾杯条例ガーディアン</text>
      <text x="600" y="148" fill="url(#logo-bands)" stroke="#330000" stroke-width="12" stroke-linejoin="round" paint-order="stroke">乾杯条例ガーディアン</text>
    </g>

    <!-- 虹色の区切り線 -->
    <rect x="16" y="206" width="195" height="14" fill="#ff0000"/>
    <rect x="211" y="206" width="195" height="14" fill="#ff9900"/>
    <rect x="406" y="206" width="195" height="14" fill="#ffff00"/>
    <rect x="601" y="206" width="195" height="14" fill="#33cc33"/>
    <rect x="796" y="206" width="195" height="14" fill="#0099ff"/>
    <rect x="991" y="206" width="193" height="14" fill="#6633cc"/>

    <!-- 水色の見出しの帯 -->
    <rect x="56" y="256" width="640" height="64" fill="#00ffff"/>
    <rect x="56" y="256" width="16" height="64" fill="#0099cc"/>
    <text x="92" y="302" font-size="38" font-weight="700" fill="#000000">まずは、ふらのワインで乾杯！</text>

    <!-- 茶色の矢印の箇条書き -->
    <g fill="#993300">
      <polygon points="64,364 92,364 92,352 116,372 92,392 92,380 64,380"/>
      <polygon points="64,424 92,424 92,412 116,432 92,452 92,440 64,440"/>
    </g>
    <text x="130" y="384" font-size="30" fill="#000000">ワインとぶどう果汁以外は雪玉で退場</text>
    <text x="130" y="444" font-size="30" fill="#000000">全員がワインかぶどう果汁なら乾杯！</text>

    <!-- 立体的な「はじめる」ボタン -->
    <rect x="216" y="482" width="260" height="22" fill="#ffff99"/>
    <rect x="216" y="504" width="260" height="22" fill="#ffcc33"/>
    <rect x="216" y="526" width="260" height="22" fill="#ff9900"/>
    <polyline points="216,548 216,482 476,482" fill="none" stroke="#ffffff" stroke-width="4"/>
    <polyline points="476,482 476,548 216,548" fill="none" stroke="#666666" stroke-width="4"/>
    <text x="346" y="527" font-size="32" font-weight="700" text-anchor="middle" fill="#000000">はじめる</text>

    <text x="56" y="600" font-size="26" fill="#333333">非公式のファンゲーム</text>

    <!-- 雪の窓の絵．ページに貼った写真のように，凹んだ枠で囲む． -->
    <g clip-path="url(#picture)">
      <rect x="772" y="262" width="356" height="52" fill="#333366"/>
      <rect x="772" y="314" width="356" height="52" fill="#336699"/>
      <rect x="772" y="366" width="356" height="102" fill="#6699cc"/>
      <path d="M772 410 Q 860 370 950 400 T 1128 392 V 468 H 772 Z" fill="#ccccff"/>
      <path d="M800 430 l 24 -64 l 24 64 z M880 438 l 20 -54 l 20 54 z M1060 434 l 24 -64 l 24 64 z" fill="#006633"/>
      <rect x="772" y="438" width="356" height="30" fill="#ffffff"/>
      <g fill="#ffffff">
        <rect x="796" y="284" width="6" height="6"/><rect x="852" y="330" width="6" height="6"/>
        <rect x="912" y="292" width="6" height="6"/><rect x="1004" y="346" width="6" height="6"/>
        <rect x="1060" y="300" width="6" height="6"/><rect x="1104" y="338" width="6" height="6"/>
        <rect x="1028" y="278" width="6" height="6"/><rect x="826" y="372" width="6" height="6"/>
      </g>
      <g transform="translate(990 462) scale(3.6)">
        <path d="M-12 -44 Q -13 -22 0 -20 Q 13 -22 12 -44 Z" fill="#ccffff" stroke="#330000" stroke-width="1.6"/>
        <path d="M-12.6 -34 H 12.6 Q 11 -21 0 -20 Q -11 -21 -12.6 -34 Z" fill="#990033"/>
        <line x1="0" y1="-20" x2="0" y2="-4" stroke="#333333" stroke-width="2.4"/>
        <ellipse cx="0" cy="-3" rx="10" ry="3" fill="#ffffff" stroke="#330000" stroke-width="1.2"/>
      </g>
      <g>
        <line x1="840" y1="352" x2="890" y2="336" stroke="#ffffff" stroke-width="5" stroke-linecap="square"/>
        <line x1="832" y1="374" x2="884" y2="358" stroke="#ccccff" stroke-width="5" stroke-linecap="square"/>
        <circle cx="912" cy="338" r="20" fill="#999999"/>
        <circle cx="909" cy="335" r="18" fill="#ffffff"/>
      </g>
    </g>
    <polyline points="768,472 768,258 1132,258" fill="none" stroke="#666666" stroke-width="8"/>
    <polyline points="1132,258 1132,472 768,472" fill="none" stroke="#ffffff" stroke-width="8"/>

    <!-- 電光掲示板風の称号．文字を虹色に塗り分ける． -->
    <rect x="796" y="500" width="308" height="76" fill="#000000"/>
    <polyline points="796,576 796,500 1104,500" fill="none" stroke="#666666" stroke-width="6"/>
    <polyline points="1104,500 1104,576 796,576" fill="none" stroke="#ffffff" stroke-width="6"/>
    <text x="950" y="552" font-size="42" font-weight="700" text-anchor="middle"><tspan fill="#ff0000">★</tspan><tspan fill="#ff9900">乾</tspan><tspan fill="#ffff00">杯</tspan><tspan fill="#00ff00">奉</tspan><tspan fill="#00ccff">行</tspan><tspan fill="#ff00ff">★</tspan></text>
  </g>
</svg>
