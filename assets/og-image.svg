<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3b63"/>
      <stop offset="1" stop-color="#6d7fa8"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98b52"/>
      <stop offset="1" stop-color="#7a3e1c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd696" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd696" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="window"><rect x="800" y="150" width="350" height="300"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#1c2742"/>
  <rect width="1200" height="90" fill="#9a9893"/>
  <g fill="#555" fill-opacity="0.45">
    <circle cx="60" cy="30" r="4"/><circle cx="180" cy="30" r="4"/><circle cx="300" cy="30" r="4"/>
    <circle cx="420" cy="30" r="4"/><circle cx="540" cy="30" r="4"/><circle cx="660" cy="30" r="4"/>
    <circle cx="780" cy="30" r="4"/><circle cx="900" cy="30" r="4"/><circle cx="1020" cy="30" r="4"/>
    <circle cx="1140" cy="30" r="4"/>
  </g>
  <rect x="0" y="90" width="1200" height="22" fill="#e9d4a8"/>
  <rect x="20" y="90" width="22" height="430" fill="#e9d4a8"/>
  <rect x="1158" y="90" width="22" height="430" fill="#e9d4a8"/>

  <g clip-path="url(#window)">
